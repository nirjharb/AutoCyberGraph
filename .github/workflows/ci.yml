name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, tests, security check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Lint (ruff)
        run: python -m ruff check backend/app backend/tests --select E,F,I --ignore E501
      - name: Tests (pytest)
        run: cd backend && python -m pytest tests/ -q
      - name: Security check (pip-audit)
        run: pip-audit -r backend/requirements.txt || true

  frontend:
    name: Frontend — tests, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
      - name: Tests (vitest)
        working-directory: frontend
        run: npx vitest run
      - name: Audit (npm)
        working-directory: frontend
        run: npm audit --audit-level=high || true

  docker:
    name: Docker build (backend image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/Dockerfile.backend -t autocybergraph-backend:ci .
